# 覆盖上游 configs/auto_labeling/yolo11n.yaml
# 唯一改动: device 从 cpu 改成 cuda:0
#
# 上游这个配置默认是 cpu，不改的话在 CUDA 镜像里也还是跑 CPU。
# 相对的 model_path 会落在容器 CWD，compose 里已把 working_dir 指到
# /app/weights，所以自动下载的权重是持久化的。

model_id: yolo11n
display_name: "YOLO11n Detection"
batch_processing_mode: "default"

params:
  model_path: "yolo11n.pt"
  device: "cuda:0"  # cuda:{index} or cpu

widgets:
  - name: button_run
    value: null
  - name: input_conf
    value: null
  - name: edit_conf
    value: 0.25
  - name: input_iou
    value: null
  - name: edit_iou
    value: 0.70
  - name: toggle_preserve_existing_annotations
    value: false
