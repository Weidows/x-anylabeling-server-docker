services:
  # CPU 全功能版（含 ultralytics / transformers / sam3）
  server:
    image: weidows/x-anylabeling-server-docker:latest
    container_name: x-anylabeling-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # GLM 等 API 类模型需要
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      # 在 server.yaml 里打开 security.api_key_enabled 后用它作为访问令牌
      XANYLABELING_API_KEY: ${XANYLABELING_API_KEY:-}
    volumes:
      # 模型权重不打进镜像，放这里持久化，避免每次重建容器都重新下载
      - ./weights:/app/weights
      # 按需覆盖配置（单文件挂载，不要整目录挂载，否则会盖掉 configs/auto_labeling/）
      # - ./server.yaml:/app/configs/server.yaml:ro
      # - ./models.yaml:/app/configs/models.yaml:ro

# GPU 部署见 deploy/cuda/，那边是一套可以直接 cp .env.example .env && up -d
# 的完整配置：显卡预留、模型缓存持久化、device 覆盖示例都齐了。
# 这里不再放一份 GPU service，避免两处定义分叉。
